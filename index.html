<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script>if (location.protocol === "http:" && location.hostname.endsWith("engrare.com")) location.replace("https:" + location.href.slice(5));</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LAQ – Gömlek renklendirme</title>
<link rel="stylesheet" href="style.css?v=4479bb45">
</head>
<body>
<section id="giris" hidden>
  <form id="girisForm" class="kutu">
    <h1>LAQ</h1>
    <input id="parola" type="password" placeholder="Parola" autocomplete="current-password" required autofocus>
    <button type="submit">Giriş</button>
    <p id="girisHata" class="hata"></p>
  </form>
</section>

<main id="uygulama" hidden>
  <header>
    <h1>LAQ</h1>
    <nav><button id="nProjeler" class="sekme">Projeler</button></nav>
    <span class="bosluk"></span>
    <button id="cikis" class="ikincil">Çıkış</button>
  </header>
  <p id="mesaj" class="mesaj" hidden></p>

  <section id="gProjeler" hidden>
    <div class="adim">
      <div class="dararac">
        <h2 class="bosluk">Projeler</h2>
        <button id="yeniProje">+ Yeni proje</button>
      </div>
      <div id="pGrid" class="dgrid"></div>
      <p class="ipucu" id="pBilgi"></p>
    </div>
  </section>

  <section id="gDrive" hidden>
    <div class="adim">
      <div class="dararac">
        <button id="dProjeler" class="ikincil">← Projeler</button>
        <button id="dUst" class="ikincil" title="Üst klasör">⬆</button>
        <span id="dYol" class="dyol"></span>
        <button id="dTumu" class="ikincil">Tümünü seç</button>
        <button id="dKlasor" class="ikincil">+ Klasör</button>
        <label class="dugme">Yükle<input type="file" id="dDosya" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
      </div>
      <div id="dGrid" class="dgrid"></div>
      <p class="ipucu" id="dBilgi"></p>
    </div>
    <div id="dSecim" class="secim" hidden>
      <span id="dSayi"></span>
      <button id="dIndir" class="ikincil">İndir</button>
      <button id="dManken">Manken olarak ekle</button>
      <button id="dGomlek">Gömlek olarak ekle</button>
      <button id="dTasi" class="ikincil">Taşı</button>
      <button id="dAd" class="ikincil">Adı değiştir</button>
      <button id="dSil" class="ikincil tehlike">Sil</button>
      <button id="dVazgec" class="ikincil">Vazgeç</button>
    </div>
  </section>

  <div id="gIs" hidden>
  <div class="projebar">
    <button id="pGeri" class="ikincil">← Projeler</button>
    <h2 id="pAd"></h2>
    <button id="pAdDegistir" class="ikincil">Adı değiştir</button>
  </div>
  <section class="adim">
    <h2>1. Fotoğrafları ekle</h2>
    <div class="iki">
      <div>
        <h3>Manken fotoğrafları</h3>
        <label class="yukle" id="mYukle">Seç veya buraya bırak<input type="file" id="mDosya" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
        <div id="mListe" class="liste"></div>
      </div>
      <div>
        <h3>Askıdaki gömlek (renk) fotoğrafları</h3>
        <label class="yukle" id="gYukle">Seç veya buraya bırak<input type="file" id="gDosya" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
        <div id="gListe" class="liste"></div>
      </div>
    </div>
    <p class="ipucu" id="limitBilgi"></p>
  </section>

  <section class="adim">
    <h2>2. Maskeyi kontrol et</h2>
    <p class="ipucu">Kırmızı = boyanacak yer, yeşil = korunan düğme. Hatalı bir yer varsa fotoğrafa dokunup fırçayla düzeltin.</p>
    <div id="maskeler" class="maskeler"></div>
  </section>

  <section class="adim">
    <h2>3. Üret ve indir</h2>
    <button id="uret" disabled>Tüm görselleri üret</button>
    <div id="ilerleme" hidden><progress id="bar" max="1" value="0"></progress> <span id="ilerlemeYazi"></span></div>
    <p id="indirSatir" hidden><a id="indir" class="dugme" href="#">ZIP indir</a></p>
    <div id="ciktilar" class="maskeler"></div>
    <p id="driveYazi" class="ipucu" hidden></p>
  </section>
  </div>
</main>

<div id="yuklemeler"></div>
<div id="onizle" hidden>
  <img id="onizleImg" alt="">
  <div class="onizlearac"><span id="onizleAd"></span><a id="onizleIndir" class="dugme" href="#">İndir</a><button id="onizleKapat" class="ikincil">Kapat</button></div>
</div>
<div id="tasiPencere" hidden>
  <div class="kutu"><h3>Taşınacak klasör</h3><select id="tasiSec"></select>
    <div><button id="tasiTamam">Taşı</button> <button id="tasiIptal" class="ikincil">Vazgeç</button></div></div>
</div>

<div id="editor" hidden>
  <div id="arac">
    <button data-mod="ekle" class="mod aktif" title="Boyanacak yeri ekle">Ekle</button>
    <button data-mod="cikar" class="mod" title="Boyanmayacak yeri çıkar">Çıkar</button>
    <button data-mod="k" class="mod" title="Metal kapak düğme işaretle">Kapak düğme</button>
    <button data-mod="c" class="mod" title="Çıt çıt işaretle">Çıt çıt</button>
    <button data-mod="kaydir" class="mod" title="Kaydır (ya da orta tuş / iki parmak)">Kaydır</button>
    <label>Boyut <input id="boyut" type="range" min="1" max="60" value="14"></label>
    <button id="geri" class="ikincil">Geri al</button>
    <button id="goster" class="ikincil">Orijinal</button>
    <button id="izler" class="ikincil">İzler: açık</button>
    <span class="bosluk"></span>
    <span id="edDurum"></span>
    <button id="kaydet">Kaydet ve yeniden hesapla</button>
    <button id="kapat" class="ikincil">Kapat</button>
  </div>
  <div id="gorus">
    <div id="sahne">
      <img id="edImg" draggable="false" alt="">
      <canvas id="edOv"></canvas>
      <canvas id="edDg"></canvas>
    </div>
    <div id="halka"></div>
  </div>
</div>
<script src="config.js?v=538bf2dd"></script>
<script src="app.js?v=f26c111c"></script>
<script src="drive.js?v=aa448ab2"></script>
</body>
</html>
